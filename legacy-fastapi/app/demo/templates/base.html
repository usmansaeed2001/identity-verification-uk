<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>{% block title %}Driver verification demo{% endblock %}</title>
  <link rel="stylesheet" href="/demo/static/demo.css">
  <script src="/demo/static/htmx.min.js" defer></script>
  <script src="/demo/static/demo.js" defer></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/demo">Driver verification</a>
      <nav class="topnav" aria-label="Demo">
        <a href="/demo">New check</a>
        <a href="/demo/admin">Cases</a>
      </nav>
      <span class="test-badge" title="Test environment. No real checks are made.">TEST</span>
    </div>
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div class="watermark" aria-hidden="true">TEST</div>
</body>
</html>
