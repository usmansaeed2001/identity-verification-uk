[project]
name = "driver-onboarding"
version = "0.1.0"
description = "Driver onboarding for UK HGV drivers: right to work, identity and licence checks"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "cryptography>=43",
    "pillow>=11",
    "gunicorn>=23",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.9", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
